name: Deploy Apresentacao.html para GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "Atividades/AV2-Estrutura-Dados-C#/6 - apresentacao/Apresentacao.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos para publicação
        run: |
          # Criar diretório de publicação
          mkdir -p public
          
          # Copiar APENAS o arquivo da apresentação
          cp "Atividades/AV2-Estrutura-Dados-C#/6 - apresentacao/Apresentacao.html" public/Apresentacao.html
          
          # Criar um README opcional na raiz do site
          echo "# Apresentação - Estrutura de Dados em C#" > public/README.md
          echo "Acesse a apresentação clicando [aqui](https://cabofernando.github.io/AS63B-Estrutura-De-Dados/)" >> public/README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4