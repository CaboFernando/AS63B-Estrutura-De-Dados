name: Deploy Apresentacao HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_file:
        description: "Caminho do HTML a publicar"
        required: false
        default: "Atividades/AV2-Estrutura-Dados-C#/6 - apresentacao/Apresentacao.html"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-apresentacao
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p _site
          SOURCE_FILE="${{ github.event.inputs.source_file }}"
          if [ -z "$SOURCE_FILE" ]; then
            SOURCE_FILE="Atividades/AV2-Estrutura-Dados-C#/6 - apresentacao/Apresentacao.html"
          fi
          if [ ! -f "$SOURCE_FILE" ]; then
            echo "Erro: arquivo não encontrado no caminho informado: $SOURCE_FILE"
            exit 1
          fi
          cp "$SOURCE_FILE" "_site/index.html"
          cp "$SOURCE_FILE" "_site/Apresentacao.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        